<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경혈 3D 아틀라스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="theme-color" content="#e9ece9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="경혈 아틀라스">
<style>html,body{margin:0;height:100%}body{font:14px system-ui}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: full-screen anatomy plate — canvas fills the frame, a title strip on top,
   a control dock at the bottom; tapped structures open a label card. */
:root {
  --bg: #e9ece9;          /* plate paper, faintly green-grey */
  --surface: #f8f9f7;
  --surface-2: #dfe3df;
  --line: #c6ccc6;
  --fg: #1d2420;
  --muted: #5b655f;
  --accent: #2f4e9e;      /* 쪽빛 — reserved for acupoints and the active control */
  --accent-fg: #ffffff;
  --muscle: #b4473e;
  --tendon: #e7dfcc;
  --bone: #e6dcc4;
  --skin: #d7b49b;
  --canvas: #e9ece9;
  --star: #b07800;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a19; --surface: #20262a; --surface-2: #2a3135; --line: #3a4347;
    --fg: #e7ebe8; --muted: #9aa49f; --accent: #8ea6ec; --accent-fg: #10142a;
    --canvas: #161a19; --star: #f0bf4c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a19; --surface: #20262a; --surface-2: #2a3135; --line: #3a4347;
  --fg: #e7ebe8; --muted: #9aa49f; --accent: #8ea6ec; --accent-fg: #10142a;
  --canvas: #161a19; --star: #f0bf4c; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
.app { position: relative; height: 100%; display: flex; flex-direction: column; }
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }

.top {
  position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 12px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.points-chip {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line);
  padding: 5px 10px; border-radius: 999px; white-space: nowrap;
}
.points-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; opacity: .35; }

.card {
  position: relative; z-index: 2; align-self: flex-start;
  margin-left: max(16px, env(safe-area-inset-left, 0px));
  margin-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 340px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 3px;
  box-shadow: 0 6px 20px rgb(0 0 0 / .08);
}
.card .ko { font-size: 16px; font-weight: 600; text-wrap: balance; }
.card .en { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.card button.close {
  position: absolute; top: 6px; right: 6px; border: 0; background: transparent; color: var(--muted);
  font-size: 18px; line-height: 1; width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
}
.card button.close:focus-visible { outline: 2px solid var(--accent); }

.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  padding-block: 8px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 8px; justify-items: center; pointer-events: none;
}
.dock > * { pointer-events: auto; }
.seg {
  display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 3px; gap: 2px; width: min(440px, 100%);
}
.seg button {
  font: 600 14px/1 var(--font-ui); color: var(--fg); background: transparent; border: 0; border-radius: 9px;
  padding: 10px 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.seg button .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button:focus-visible, .chips button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opacity {
  display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
  width: min(440px, 100%);
}
.opacity input { flex: 1; accent-color: var(--accent); min-width: 0; }
.opacity output { font-variant-numeric: tabular-nums; width: 3.2em; text-align: right; }
.chips {
  display: flex; gap: 6px; overflow-x: auto; max-width: 100%; scrollbar-width: none; padding: 2px;
}
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none; font: 500 13px/1 var(--font-ui); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; white-space: nowrap;
}
.chips button:active { background: var(--surface-2); }
.credit { font-size: 10.5px; color: var(--muted); text-align: center; }
.credit a { color: inherit; }

.loading {
  position: absolute; inset: 0; z-index: 3; display: grid; place-content: center; gap: 10px; text-align: center;
  background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.loading .bar { width: 220px; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin: 0 auto; }
.loading .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.loading p { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.loading strong { font-size: 15px; }
.hint { font-size: 11.5px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .loading .bar span { transition: none; } }

.pts-btn {
  margin-left: auto; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font: 600 13px/1 var(--font-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  padding: 8px 12px; border-radius: 999px; white-space: nowrap;
}
.pts-btn b { font-variant-numeric: tabular-nums; color: var(--accent); }
.pts-btn:focus-visible, .sheet button:focus-visible, .sheet input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips.mer button { display: inline-flex; align-items: center; gap: 6px; }
.chips.mer button i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; box-shadow: 0 0 0 1.5px var(--surface); }
.chips.mer button[aria-pressed="true"] { border-color: var(--fg); background: var(--surface-2); font-weight: 600; }
.chips.mer .sep { width: 1px; background: var(--line); flex: none; margin: 4px 2px; }

.card { max-height: 46vh; overflow-y: auto; overscroll-behavior: contain; }
@media (max-width: 719px) { .card { max-height: 34vh; } }
.card .pt-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-right: 26px; }
.card .pt-code { font-family: var(--font-mono); font-weight: 500; font-size: 13px; padding: 1px 6px; border-radius: 6px; color: #fff; }
.card .pt-name { font-size: 18px; font-weight: 700; }
.card .pt-hanja { font-size: 15px; color: var(--muted); }
.card .pt-star { font-size: 11.5px; font-weight: 600; color: var(--star); border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px; }
.sheet .rows button em { margin-left: auto; font-style: normal; color: var(--star); flex: none; }
#toggle-star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.card dl { margin: 6px 0 0; display: grid; gap: 7px; }
.card dt { font-size: 11px; letter-spacing: .06em; color: var(--muted); margin-bottom: 1px; }
.card dd { margin: 0; font-size: 13.5px; line-height: 1.55; }
.card dd.model { color: var(--muted); font-size: 12.5px; }
.card dd.needle { border-left: 3px solid var(--accent); padding-left: 8px; }
.glabel {
  position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 11px/1 var(--font-ui); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); padding: 3px 6px; border-radius: 999px; opacity: .95;
}
.glabel.at { font-size: 12px; font-weight: 700; border-width: 2px; }
.quiz {
  position: relative; z-index: 3; align-self: stretch; display: grid; gap: 8px;
  margin-left: max(16px, env(safe-area-inset-left, 0px)); margin-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; box-shadow: 0 6px 20px rgb(0 0 0 / .1); max-height: 52vh; overflow-y: auto;
}
.qz-top { display: flex; align-items: center; gap: 8px; }
.qz-modes { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 2px; gap: 2px; }
.qz-modes button { font: 600 12.5px/1 var(--font-ui); color: var(--fg); background: transparent; border: 0; border-radius: 7px; padding: 7px 10px; cursor: pointer; }
.qz-modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.qz-score { margin-left: auto; font: 600 13px var(--font-ui); font-variant-numeric: tabular-nums; color: var(--muted); }
.qz-close { border: 0; background: transparent; color: var(--muted); font-size: 20px; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; }
.qz-prompt { margin: 0; font-size: 15px; } .qz-prompt b { font-size: 18px; }
.qz-hint, .qz-msg { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.qz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.qz-choices button { font: 600 14px/1.2 var(--font-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 8px; cursor: pointer; }
.qz-choices button.right { background: #1f9d55; color: #fff; border-color: #1f9d55; }
.qz-choices button.wrong { background: #d23b3b; color: #fff; border-color: #d23b3b; }
.qz-result { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
.qz-verdict { margin: 0; font-weight: 700; font-size: 16px; }
.qz-result.ok .qz-verdict { color: #1f9d55; } .qz-result.no .qz-verdict { color: #d23b3b; }
.qz-detail { margin: 0; font-size: 13px; } .qz-loc { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.qz-actions { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.qz-actions button { font: 600 13px/1 var(--font-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.qz-actions button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
#toggle-quiz[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.qz-modes button:focus-visible, .qz-choices button:focus-visible, .qz-actions button:focus-visible, .qz-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.labels { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.plabel {
  position: absolute; left: 0; top: 0; transform: translate(-50%, calc(-100% - 9px)); white-space: nowrap;
  font: 600 11.5px/1 var(--font-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  padding: 3px 6px; border-radius: 6px; box-shadow: 0 2px 6px rgb(0 0 0 / .12);
}
.plabel.sel { font-size: 13px; padding: 4px 8px; border-width: 1.5px; }

.sheet {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; max-height: 78%;
  display: flex; flex-direction: column; background: var(--surface); border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgb(0 0 0 / .18);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet header {
  display: flex; align-items: center; gap: 10px; padding-block: 14px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet header h2 { margin: 0; font-size: 16px; }
.sheet header button { margin-left: auto; border: 0; background: var(--surface-2); color: var(--fg); width: 32px; height: 32px; border-radius: 8px; font-size: 18px; cursor: pointer; }
.sheet .search { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 8px; }
.sheet input {
  width: 100%; box-sizing: border-box; font: 15px var(--font-ui); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.sheet .list { overflow-y: auto; overscroll-behavior: contain; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 16px; }
.sheet h3 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .04em; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.sheet h3 i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.sheet .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
.sheet .row { display: flex; gap: 4px; min-width: 0; }
.sheet .row .go { flex: 1; }
.sheet .rows .hz { font-size: .9em; color: var(--muted); }
@media (max-width: 480px) { .sheet .rows .hz { display: none; } }
.sheet .rows .chk {
  flex: none; width: 36px; justify-content: center; font: 700 16px/1 var(--font-ui); color: var(--accent-fg);
  padding: 0;
}
.sheet .rows .chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.sheet h3 span { flex: 1; min-width: 0; }
.sheet h3 .grp-pick { font: 600 12px/1 var(--font-ui); color: var(--accent); background: none; border: 0; cursor: pointer; padding: 6px 4px; letter-spacing: 0; }
.sheet .picktools {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-block: 0 4px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet .picktools strong { font-size: 13px; margin-right: auto; font-variant-numeric: tabular-nums; }
.sheet .picktools button { font: 600 12.5px/1 var(--font-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.sheet .picktools button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.sheet .pickhint { margin: 0; font-size: 12px; color: var(--muted); padding-block: 2px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card .pt-pick {
  justify-self: start; margin-top: 6px; font: 600 12.5px/1 var(--font-ui); color: var(--accent); background: transparent;
  border: 1px solid var(--accent); border-radius: 8px; padding: 7px 10px; cursor: pointer;
}
.card .pt-pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
#toggle-picks[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.sheet .rows button {
  display: flex; align-items: baseline; gap: 6px; text-align: left; cursor: pointer; min-width: 0;
  font: 500 14px/1.2 var(--font-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 9px; padding: 9px 10px;
}
.sheet .rows button code { font: 500 11.5px var(--font-mono); color: var(--muted); flex: none; min-width: 3.4em; }
.sheet .rows button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
@media (min-width: 720px) {
  .sheet { left: auto; top: 0; width: 380px; max-height: none; border-radius: 0; border-top: 0; border-left: 1px solid var(--line); }
}
@media (min-width: 720px) {
  .brand h1 { font-size: 19px; }
  .card { max-width: 380px; }
}
</style>

<div class="app">
  <div id="stage" aria-label="3D 인체 모델. 드래그로 회전, 두 손가락으로 확대, 탭하면 구조물 이름 표시"></div>

  <header class="top">
    <div class="brand">
      <h1>경혈 3D 아틀라스</h1>
      <p>피부·근육·뼈 층 전환 · 혈이나 구조물을 탭하면 설명 표시</p>
    </div>
    <button type="button" class="pts-btn" id="ptsBtn" aria-haspopup="dialog">경혈 목록 <b id="ptsCount">115</b></button>
  </header>

  <section class="quiz" id="quiz" hidden aria-live="polite"></section>

  <section class="card" id="card" hidden aria-live="polite">
    <button class="close" id="cardClose" aria-label="닫기">×</button>
    <div id="cardStruct">
      <div class="ko" id="cardKo"></div>
      <div class="en" id="cardEn"></div>
    </div>
    <div id="cardPoint" hidden></div>
    <div class="meta" id="cardMeta"></div>
  </section>

  <div class="dock">
    <div class="opacity" id="opacityRow" hidden>
      <label for="skinOpacity">피부 불투명도</label>
      <input type="range" id="skinOpacity" min="0.05" max="0.8" step="0.05" value="0.3">
      <output id="skinOpacityOut" for="skinOpacity">30%</output>
    </div>
    <div class="seg" role="group" aria-label="보기 층">
      <button type="button" id="mode-skin" data-mode="skin" aria-pressed="true"><span class="sw" style="background:var(--skin)"></span>피부</button>
      <button type="button" id="mode-overlay" data-mode="overlay" aria-pressed="false"><span class="sw" style="background:linear-gradient(135deg,var(--skin) 50%,var(--muscle) 50%)"></span>겹쳐보기</button>
      <button type="button" id="mode-muscle" data-mode="muscle" aria-pressed="false"><span class="sw" style="background:var(--muscle)"></span>근육</button>
      <button type="button" id="mode-bone" data-mode="bone" aria-pressed="false"><span class="sw" style="background:var(--bone);outline:1px solid var(--line)"></span>뼈</button>
    </div>
    <div class="chips mer" id="merChips" role="group" aria-label="경맥 표시"></div>
    <div class="chips" id="chips" role="group" aria-label="부위로 이동"></div>
    <div class="credit">혈 위치: 원광대 경혈학교실 강의자료 정의로 계산 · 모델: <a href="https://www.z-anatomy.com" target="_blank" rel="noopener">Z-Anatomy</a> (CC BY-SA 4.0)</div>
  </div>

  <div class="labels" id="labels" aria-hidden="true"></div>

  <section class="sheet" id="sheet" role="dialog" aria-label="경혈 목록" hidden>
    <header><h2>경혈 목록</h2><button type="button" id="sheetClose" aria-label="닫기">×</button></header>
    <div class="search"><input type="search" id="ptSearch" placeholder="혈명, 한자, 코드 검색 (예: 내관, LU5)" autocomplete="off"></div>
    <div class="picktools">
      <strong id="pickSummary">내 선택 0개</strong>
      <button type="button" id="pickStar">★ 중요혈 모두 담기</button>
      <button type="button" id="pickClear">비우기</button>
      <button type="button" id="pickShow" class="primary">선택한 혈만 보기</button>

function flyToPoint(m, scale, noCard, jitter) {

  const qz = document.getElementById('quiz');
  const wide = el => el.getBoundingClientRect().width > stage.clientWidth * 0.6;   // panels only block the view on narrow screens
  const qzB = qz && !qz.hidden && wide(qz) ? qz.getBoundingClientRect().bottom : 0;
  const cardB = !noCard && !card.hidden && wide(card) ? card.getBoundingClientRect().bottom : 0;
  const dockT = document.querySelector('.dock').getBoundingClientRect().top;

    const right = new THREE.Vector3().crossVectors(m.v, new THREE.Vector3(0, 1, 0)).normalize();
    const upv = new THREE.Vector3().crossVectors(right, m.v).normalize();
    const span = bandH * worldPerPx * 0.28;
    focus.addScaledVector(right, (Math.random() * 2 - 1) * span).addScaledVector(upv, (Math.random() * 2 - 1) * span);
  }
  const up = new THREE.Vector3(0, 1, 0).addScaledVector(m.v, -m.v.y).normalize();
  const tgt = focus.clone().addScaledVector(up, (bandMid - projMid) * worldPerPx);

  anim = (now) => {

function renderQuiz(extra) {
  const q = quizEl; q.textContent = '';
  const top = el('div', 'qz-top');
  const seg = el('div', 'qz-modes');
  [['locate', '위치 찾기'], ['name', '이름 맞히기']].forEach(([k, t]) => {
    const b = el('button', null, t); b.type = 'button'; b.setAttribute('aria-pressed', String(quiz.mode === k));
    b.addEventListener('click', () => { if (quiz.mode !== k) { quiz.mode = k; quiz.score = 0; quiz.n = 0; quizNext(); } });
    seg.append(b);
  });
  const sc = el('span', 'qz-score', quiz.n ? `${quiz.score} / ${quiz.n}` : '');
  const x = el('button', 'qz-close', '×'); x.type = 'button'; x.setAttribute('aria-label', '퀴즈 끝내기'); x.addEventListener('click', quizStop);
  top.append(seg, sc, x); q.append(top);
  if (extra) q.append(extra);
  resize();
}
function quizNext() {
  const pool = quizPool();
  clearPick(); clearGuide(); quizTap.visible = false; quiz.answered = false;
  if (!pool.length) { renderQuiz(el('p', 'qz-msg', '지금 필터에 표시되는 혈이 없습니다. 경맥이나 내 선택 필터를 바꿔주세요.')); return; }
  const m = pickTarget(pool); quiz.target = m;
  if (quiz.mode === 'locate') {
    setMarkersVisible(false); quiz.hideSel = false;
    const box = el('div');
    const pr = el('p', 'qz-prompt'); pr.append(el('b', null, `${m.pt.ko} ${m.pt.hanja}`), document.createTextNode(` (${m.pt.code})`));
    box.append(pr, el('p', 'qz-hint', `${m.side === '정중' ? '정중선' : m.side + ' 몸'}에서 위치를 탭하세요. 돌려보거나 확대해도 됩니다.`));
    renderQuiz(box);
    flyToPoint(m, 2.4, true, true);
  } else {
    setMarkersVisible(false); quiz.hideSel = true; selPt = m; updateSelMarker();
    const others = pool.filter(p => p !== m.pt);
    let opts = others.filter(p => p.mer === m.pt.mer).sort(() => Math.random() - .5).slice(0, 3);
    if (opts.length < 3) opts = opts.concat(others.filter(p => !opts.includes(p)).sort(() => Math.random() - .5).slice(0, 3 - opts.length));
    if (opts.length < 3) opts = opts.concat(ACU.points.filter(p => p !== m.pt && !opts.includes(p)).sort(() => Math.random() - .5).slice(0, 3 - opts.length));
    const choices = opts.concat([m.pt]).sort(() => Math.random() - .5);
    const box = el('div');
    box.append(el('p', 'qz-prompt', '표시된 혈의 이름은?'));
    const grid = el('div', 'qz-choices');
    choices.forEach(p => {
      const b = el('button', null, `${p.ko} ${p.hanja}`); b.type = 'button';
      b.addEventListener('click', () => quizAnswerName(p, b, grid));
      grid.append(b);
    });
    box.append(grid); renderQuiz(box);
    flyToPoint(m, 1.6, true);
  }
}
function resultBox(ok, msg) {
  const box = el('div', 'qz-result ' + (ok ? 'ok' : 'no'));
  box.append(el('p', 'qz-verdict', ok ? '정답' : '오답'), el('p', 'qz-detail', msg));
  const loc = el('p', 'qz-loc', quiz.target.pt.loc); box.append(loc);
  const row = el('div', 'qz-actions');
  const nx = el('button', 'primary', '다음 문제'); nx.type = 'button'; nx.addEventListener('click', quizNext);
  const dt = el('button', null, '혈 카드 보기'); dt.type = 'button';
  dt.addEventListener('click', () => { const t = quiz.target; quizStop(); selectPoint(t, true); });
  row.append(nx, dt); box.append(row);
  return box;
}
function quizHandleTap(x, y) {
  if (quiz.mode !== 'locate' || quiz.answered) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera({ x: ((x - r.left) / r.width) * 2 - 1, y: -((y - r.top) / r.height) * 2 + 1 }, camera);
  const hit = ray.intersectObjects(mode === 'overlay' ? [groups.muscle, skinView] : bodyTargets().concat([skinView]), true)[0];
  if (!hit) return;
  const m = quiz.target, th = regionThreshold(m.pt.code);
  const cand = INST.filter(i => i.pt === m.pt);
  let best = cand[0], bd = 1e9;
  cand.forEach(i => { const d = i.pos.distanceTo(hit.point); if (d < bd) { bd = d; best = i; } });
  quiz.answered = true; quiz.n++;
  const ok = bd <= th; if (ok) quiz.score++;
  const a = quizTap.geometry.attributes.position.array; a[0] = hit.point.x; a[1] = hit.point.y; a[2] = hit.point.z;
  quizTap.geometry.attributes.position.needsUpdate = true; quizTap.geometry.computeBoundingSphere();
  quizTap.material.color.set(ok ? 0x1f9d55 : 0xd23b3b); quizTap.visible = true;
  quiz.target = best; quiz.hideSel = false; selPt = best; updateSelMarker(); showGuide(best);
  renderQuiz(resultBox(ok, `정답 위치와 ${bd.toFixed(1)}cm 차이 (허용 ${th.toFixed(1)}cm)`));
  requestRender();
}
function quizAnswerName(p, btn, grid) {
  if (quiz.answered) return;
  quiz.answered = true; quiz.n++;
  const ok = p === quiz.target.pt; if (ok) quiz.score++;
  grid.querySelectorAll('button').forEach(b => { b.disabled = true; if (b.textContent.startsWith(quiz.target.pt.ko + ' ')) b.classList.add('right'); });
  if (!ok) btn.classList.add('wrong');
  quiz.hideSel = false; showGuide(quiz.target);
  const scEl = quizEl.querySelector('.qz-score'); if (scEl) scEl.textContent = `${quiz.score} / ${quiz.n}`;
  const box = resultBox(ok, `${quiz.target.pt.ko} ${quiz.target.pt.hanja} (${quiz.target.pt.code})`);
  quizEl.append(box); resize(); requestRender();
}

/* ---------- render loop (on demand) ---------- */
let needs = true;
function requestRender() { needs = true; }
controls.addEventListener('change', requestRender);
let freeFrac = 1;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h);
  const qz = document.getElementById('quiz');
  const top = Math.max(document.querySelector('.top').getBoundingClientRect().bottom, qz && !qz.hidden && qz.getBoundingClientRect().width > w * 0.6 ? qz.getBoundingClientRect().bottom : 0);
  const dock = document.querySelector('.dock').getBoundingClientRect().top;
  const free = Math.max(120, dock - top), mid = (top + dock) / 2;
  freeFrac = Math.min(1, free / h);
  camera.setViewOffset(w, h, 0, Math.round(h / 2 - mid), w, h);
  camera.updateProjectionMatrix(); if (typeof sizeMarkers === 'function') sizeMarkers(); requestRender();
}
new ResizeObserver(resize).observe(stage);
function loop(now) {
  requestAnimationFrame(loop);
  if (anim) { anim(now); needs = true; }
  const changed = controls.update();
  if (needs || changed) { sizeMarkers(); renderer.render(scene, camera); updateLabels(); updateGuideLabels(); needs = false; }
}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

(async () => {
  resize(); applyTheme(); requestAnimationFrame(loop);
  try {
    const buf = await fetchBin('anatomy.bin.gz');
    parse(buf);
    buildSkinUnion();
    let start = 'skin';
    try { start = localStorage.getItem('atlas-mode') || 'skin'; } catch (e) {}
    setMode(['skin', 'overlay', 'muscle', 'bone'].includes(start) ? start : 'skin');
    flyTo(PRESETS[0], true);
    try { const mf = localStorage.getItem('atlas-mer'); if (mf && (mf === 'ALL' || MER_SHORT[mf])) { merFilter = mf; merChips.querySelectorAll('button[id^="mer-"]').forEach(x => x.setAttribute('aria-pressed', String(x.id === 'mer-' + mf))); } } catch (e) {}
    applyMarkerTheme(); buildMarkers();
    document.getElementById('loading').hidden = true;
    window.__atlasReady = true;
  } catch (err) {
    document.querySelector('#loading strong').textContent = '모델을 불러오지 못했습니다';
    document.getElementById('loadText').textContent = err.message;
    console.error(err);
  }
})();
window.__atlas = { quizStart, quizStop, quiz, quizHandleTap, showGuide, setPick: (c, on) => setPick(c, on), togglePicks: () => pickBtn.click(), setMode, flyTo, PRESETS, select, groups, camera, controls, koName, INST, selectPoint, flyToPoint, toggleStar: () => starBtn.click(),
  setNames: v => { showNames = v; nameBtn.setAttribute('aria-pressed', String(v)); requestRender(); },
  setMer: id => document.getElementById('mer-' + id).click() };
})();
</script>
